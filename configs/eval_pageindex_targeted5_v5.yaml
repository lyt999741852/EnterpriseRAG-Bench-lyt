# v5 targeted 5-question run: P1/P2 fixes on the current v4.3 experiment code.
#
# Each question pins one previously failing dimension:
#   qst_0298 semantic       -> direct event-source full-document fallback
#   qst_0341 project_related -> authority-before-node-audit (proposal rejection)
#   qst_0432 completeness   -> intake artifact content-level dedup
#   qst_0480 high_level     -> scoped corpus synthesis + org-chart second hop
#   qst_0416 conflicting_info -> same-entity version pairing second hop
#
# Acceptance: 5-question official correctness/completeness/recall/extra-docs,
# compared per question against v4 where available. Do NOT run 500 questions
# with this experimental code.
corpus_dir: "corpus/all_documents"
questions_file: "questions.jsonl"
output_dir: "outputs"
index_dir: ".index_cache/full_es_bge_small"
index_backend: "elasticsearch"

chunking:
  method: "fixed"
  version: "fixed-v2"
  manifest_enabled: true
  chunk_size: 512
  chunk_overlap: 0

embedding:
  provider: "sentence_transformers"
  model_name: "BAAI/bge-small-en-v1.5"
  device: "cuda"
  batch_size: 256
  dimension: 384
  revision: "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"

elasticsearch:
  url: "http://127.0.0.1:9200"
  index_name: "enterprise-rag-bge-small-v1"
  alias_name: "enterprise-rag-bge-small"
  bulk_size: 256
  request_timeout: 180

llm:
  provider: "openai_compatible"
  api_base: "http://10.72.100.35:7777/v1"
  api_key_env: "LARK_API_KEY"
  model_name: "lark"
  temperature: 0.0
  max_tokens: 4096
  timeout: 180
  retry_attempts: 3
  retry_backoff_seconds: 1.0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

retrieval:
  method: "hybrid"
  top_k: 30
  candidate_k: 240
  fusion_method: "rrf"
  rrf_k: 60
  dense_weight: 0.3
  reranker:
    enabled: false
  parent_expansion:
    enabled: false

generation:
  max_context_chunks: 10
  max_chunks_per_doc: 4
  max_document_ids: 10
  evidence_selection_enabled: true
  evidence_selection_mode: "precision_v3"
  evidence_selection_candidate_chunks: 24
  evidence_selection_max_chunks: 10
  evidence_selection_anchor_chunks: 0
  evidence_selection_fallback_chunks: 0
  evidence_selection_fail_closed: true
  fact_verification_enabled: true
  final_answer_audit_enabled: true

pageindex:
  enabled: true
  home: "/opt/enterprise-rag-bench/PageIndex"
  manifest_path: ".index_cache/full_es_bge_small/manifest.sqlite3"
  cache_dir: ".pageindex_cache/targeted5_v5"
  min_words: 350
  min_headings: 2
  max_candidate_documents: 24
  max_nodes_per_document: 40
  node_preview_chars: 800
  max_followup_queries: 4
  max_hops: 2
  require_node_audit: true
  fallback_to_es_on_incomplete: true
  max_partial_full_document_chars: 18000
  # Fireflies transcripts / Gmail threads may exceed the generic partial cap;
  # the narrowed event-source full read uses this larger ceiling.
  semantic_event_full_max_chars: 40000

evaluation:
  enabled: false

pipeline:
  name: "pageindex_targeted5_v5_20260803"
  source_filter: []
  source_filter_mode: "exact"
  question_ids:
    - "qst_0298" # semantic: direct event-source full-document fallback
    - "qst_0341" # project_related: authority-before-node-audit
    - "qst_0432" # completeness: intake artifact dedup, answer only Jira
    - "qst_0480" # high_level: scoped synthesis, top-level departments only
    - "qst_0416" # conflicting_info: same-entity version pairing
  overwrite_index: false
  resume: true
  resume_legacy: false
  checkpoint_interval: 1
