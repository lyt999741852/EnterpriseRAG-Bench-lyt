# EnterpriseRAG-Bench Pipeline Configuration - Groq Free Tier
# Uses Groq's free API for LLM generation + evaluation.
# Sign up at https://console.groq.com -> get API key -> set GROQ_API_KEY env var.
# Free tier: 30 RPM, 1,000 req/day, ~320 tokens/sec on Llama 3.3 70B.

# ===== Data paths (relative to project root) =====
corpus_dir: "demo_corpus"
questions_file: "questions.jsonl"
output_dir: "outputs"
index_dir: ".index_cache/demo_bm25"

# ===== Chunking =====
chunking:
  method: "fixed"
  version: "fixed-v2"
  manifest_enabled: true
  chunk_size: 512
  chunk_overlap: 0

# ===== Embedding =====
embedding:
  provider: "ollama"
  model_name: "nomic-embed-text"
  api_base: "http://localhost:11434"
  device: "cpu"
  batch_size: 16
  dimension: 0

# ===== LLM (Groq free tier) =====
llm:
  provider: "openai_compatible"
  api_base: "https://api.groq.com/openai/v1"
  api_key_env: "GROQ_API_KEY"
  model_name: "llama-3.3-70b-versatile"     # free: llama-3.3-70b-versatile / mixtral-8x7b-32768
  temperature: 0.0
  max_tokens: 1024
  timeout: 60
  retry_attempts: 3
  retry_backoff_seconds: 1.0

# ===== Retrieval =====
retrieval:
  method: "bm25"
  top_k: 10
  dense_weight: 0.5
  reranker:
    enabled: false
    model_name: ""
    top_n: 10

# ===== Evaluation (also uses Groq free tier for local eval) =====
evaluation:
  llm:
    provider: "openai_compatible"
    api_base: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"
    model_name: "llama-3.3-70b-versatile"
    temperature: 0.0
  no_correction: true

# ===== Pipeline =====
pipeline:
  name: "baseline_groq"
  source_filter: ["github"]
  source_filter_mode: "exact"
  overwrite_index: false
  resume: true
  checkpoint_interval: 1

generation:
  max_context_chunks: 8
  max_chunks_per_doc: 2
  max_document_ids: 10
