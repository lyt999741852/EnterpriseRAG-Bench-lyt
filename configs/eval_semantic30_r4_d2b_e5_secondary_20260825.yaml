# D2b: S1 + E5-large (1024-dim) Semantic-only secondary dense candidates.
# PageIndex OFF; --no-correction is applied by the remote score watcher.
corpus_dir: corpus/all_documents
questions_file: questions.jsonl
output_dir: outputs
index_dir: .index_cache/full_es_bge_small
index_backend: elasticsearch
chunking:
  method: fixed
  version: fixed-v2
  manifest_enabled: true
  chunk_size: 512
  chunk_overlap: 0
embedding:
  provider: sentence_transformers
  model_name: BAAI/bge-small-en-v1.5
  device: cpu
  batch_size: 64
  dimension: 384
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
elasticsearch:
  url: http://127.0.0.1:9200
  index_name: enterprise-rag-bge-small-v1
  alias_name: enterprise-rag-bge-small
  bulk_size: 256
  request_timeout: 180
llm:
  provider: openai_compatible
  api_base: http://10.72.100.35:7777/v1
  api_key_env: ''
  api_key: lark
  model_name: lark
  temperature: 0.0
  max_tokens: 8192
  timeout: 180
  retry_attempts: 3
  retry_backoff_seconds: 1.0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
retrieval:
  method: hybrid
  top_k: 30
  candidate_k: 240
  fusion_method: rrf
  rrf_k: 60
  dense_weight: 0.3
  query_rewrite:
    enabled: true
    types:
    - semantic
    - project_related
    - completeness
    max_queries: 2
  answer_intent:
    enabled: true
    types:
    - semantic
    - project_related
    - completeness
    max_queries: 2
  multi_view:
    enabled: true
    default_views:
    - original_keyword
    - original_dense
    weights:
      original_keyword: 1.2
      original_dense: 1.0
      rewritten_dense: 0.9
      answer_intent_dense: 0.4
      semantic_secondary_dense: 0.45
    routes:
      semantic:
      - original_keyword
      - original_dense
      - rewritten_dense
      - answer_intent_dense
      - semantic_secondary_dense
      project_related:
      - original_keyword
      - original_dense
      - rewritten_dense
      - answer_intent_dense
      completeness:
      - original_keyword
      - original_dense
      - answer_intent_dense
    route_weights:
      semantic:
        original_keyword: 1.5
        original_dense: 1.0
        rewritten_dense: 0.8
        answer_intent_dense: 0.25
        semantic_secondary_dense: 0.45
  reranker:
    enabled: true
    model_name: rerank
    api_base: http://10.72.55.209:7992/v1
    api_key_env: EMBEDDING_API_KEY
    candidate_k: 120
    top_n: 30
    timeout: 120
  parent_expansion:
    enabled: false
  semantic_rescue:
    enabled: true
    rewrite_queries: 1
    intent_queries: 1
    per_view_top_n: 8
    consensus_top_docs: 2
    base_anchor_docs: 8
    max_rescue_docs: 1
    insertion_after_chunks: 8
  semantic_secondary_dense:
    enabled: true
    types:
    - semantic
    top_k: 80
    max_chunks_per_document: 2
    collapse_recursive_partitions: true
    embedding:
      provider: sentence_transformers
      model_name: /data06/embedding-models/multilingual-e5-large
      device: cpu
      batch_size: 16
      dimension: 1024
      fp16: false
      query_prefix: 'query: '
      document_prefix: 'passage: '
    elasticsearch:
      url: http://127.0.0.1:9200
      index_name: enterprise-rag-e5-large-v1
      alias_name: enterprise-rag-e5-large
      bulk_size: 256
      request_timeout: 180
      dense_mode: script_score
generation:
  max_context_chunks: 10
  max_chunks_per_doc: 4
  max_document_ids: 10
  evidence_selection_enabled: true
  evidence_selection_mode: precision_v3
  evidence_selection_candidate_chunks: 24
  evidence_selection_max_chunks: 10
  evidence_selection_anchor_chunks: 0
  evidence_selection_fallback_chunks: 0
  evidence_selection_fail_closed: true
  fact_verification_enabled: true
  final_answer_audit_enabled: true
pageindex:
  enabled: false
  home: /opt/enterprise-rag-bench/PageIndex
  manifest_path: .index_cache/full_es_bge_small/manifest.sqlite3
  cache_dir: .pageindex_cache/semantic30_r4_baseline_off_20260820
  min_words: 350
  min_headings: 2
  max_candidate_documents: 24
  max_nodes_per_document: 40
  node_preview_chars: 800
  max_followup_queries: 4
  max_hops: 2
  require_node_audit: true
  fallback_to_es_on_incomplete: true
  max_partial_full_document_chars: 18000
  semantic_event_full_max_chars: 40000
evaluation:
  enabled: false
pipeline:
  name: semantic30_r4_d2b_e5_secondary_20260825
  question_only: true
  question_router:
    enabled: true
  source_filter: []
  source_filter_mode: exact
  question_ids:
  - qst_0176
  - qst_0180
  - qst_0184
  - qst_0188
