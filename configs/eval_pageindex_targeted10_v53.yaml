# v5.3 query-rewrite validation: 7 retrieval-miss + 3 anchors: qst_0341 multi_hop re-exposure + qst_0480
# high_level org sweep fixes on top of v5.
#
# v5.1 fixed qst_0298 (semantic recall 100/extra 0), qst_0432 (answer Jira,
# correct), qst_0341 (multi_hop authority files re-exposed, restored to v4
# level). v5.1 5-question combined 54.67 == v4 on the same 5 questions.
# v5.2 runs the full v4 10-question set with the v5.1 code to compare
# directly against v4's 77.33 combined.
# v5.1 changes:
#   - multi_hop: files that passed the file-level authority filter but whose
#     nodes were all rejected by the node auditor re-enter as bounded full
#     documents (restores the Jira applied record for qst_0341).
#   - corpus_level: when the tree pass admits nothing, run a deterministic
#     organization-structure sweep instead of falling back to raw ES.
#   - high_level generation bypasses the fail-closed precision selector.
#   - glyph normalization now also repairs corrupted en-dash bytes ("2�C4").
corpus_dir: "corpus/all_documents"
questions_file: "questions.jsonl"
output_dir: "outputs"
index_dir: ".index_cache/full_es_bge_small"
index_backend: "elasticsearch"

chunking:
  method: "fixed"
  version: "fixed-v2"
  manifest_enabled: true
  chunk_size: 512
  chunk_overlap: 0

embedding:
  provider: "sentence_transformers"
  model_name: "BAAI/bge-small-en-v1.5"
  device: "cuda"
  batch_size: 256
  dimension: 384
  revision: "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"

elasticsearch:
  url: "http://127.0.0.1:9200"
  index_name: "enterprise-rag-bge-small-v1"
  alias_name: "enterprise-rag-bge-small"
  bulk_size: 256
  request_timeout: 180

llm:
  provider: "openai_compatible"
  api_base: "http://10.72.100.35:7777/v1"
  api_key_env: "LARK_API_KEY"
  model_name: "lark"
  temperature: 0.0
  max_tokens: 4096
  timeout: 180
  retry_attempts: 3
  retry_backoff_seconds: 1.0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

retrieval:
  method: "hybrid"
  query_rewrite:
    enabled: true
    types: ["basic", "semantic"]
    max_queries: 2

  top_k: 30
  candidate_k: 240
  fusion_method: "rrf"
  rrf_k: 60
  dense_weight: 0.3
  reranker:
    enabled: false
  parent_expansion:
    enabled: false

generation:
  max_context_chunks: 10
  max_chunks_per_doc: 4
  max_document_ids: 10
  evidence_selection_enabled: true
  evidence_selection_mode: "precision_v3"
  evidence_selection_candidate_chunks: 24
  evidence_selection_max_chunks: 10
  evidence_selection_anchor_chunks: 0
  evidence_selection_fallback_chunks: 0
  evidence_selection_fail_closed: true
  fact_verification_enabled: true
  final_answer_audit_enabled: true

pageindex:
  enabled: true
  home: "/opt/enterprise-rag-bench/PageIndex"
  manifest_path: ".index_cache/full_es_bge_small/manifest.sqlite3"
  cache_dir: ".pageindex_cache/targeted10_v53"
  min_words: 350
  min_headings: 2
  max_candidate_documents: 24
  max_nodes_per_document: 40
  node_preview_chars: 800
  max_followup_queries: 4
  max_hops: 2
  require_node_audit: true
  fallback_to_es_on_incomplete: true
  max_partial_full_document_chars: 18000
  semantic_event_full_max_chars: 40000

evaluation:
  enabled: false

pipeline:
  name: "pageindex_targeted10_v53_20260803"
  source_filter: []
  source_filter_mode: "exact"
  question_ids:
    - "qst_0050"
    - "qst_0093"
    - "qst_0112"
    - "qst_0116"
    - "qst_0184"
    - "qst_0231"
    - "qst_0251"
    - "qst_0154"
    - "qst_0298"
    - "qst_0301"
  overwrite_index: false
  resume: true
  resume_legacy: false
  checkpoint_interval: 1
