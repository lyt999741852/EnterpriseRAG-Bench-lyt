# V6b: precision_v3 prompt relaxation (reduce over-rejection).
#
# Based on V5.2 (current best, combined 77.33).
# Code changes (in generator.py):
#   1. System prompt: "fail-closed admission controller" → "precision evidence selector"
#   2. User template: relaxed rules for partial support, approximate values, proposals
#   3. Parser: accept partial coverage when >=50% facets covered (instead of rejecting all)
#
# Rationale: 50-question test showed 9 questions with gold in candidates but rejected.
# The fail-closed cascade (1 missing facet → coverage_complete=false → parser returns []
# → fail_closed returns empty) was too aggressive.
corpus_dir: "corpus/all_documents"
questions_file: "questions.jsonl"
output_dir: "outputs"
index_dir: ".index_cache/full_es_bge_small"
index_backend: "elasticsearch"

chunking:
  method: "fixed"
  version: "fixed-v2"
  manifest_enabled: true
  chunk_size: 512
  chunk_overlap: 0

embedding:
  provider: "sentence_transformers"
  model_name: "BAAI/bge-small-en-v1.5"
  device: "cuda"
  batch_size: 256
  dimension: 384
  revision: "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"

elasticsearch:
  url: "http://127.0.0.1:9200"
  index_name: "enterprise-rag-bge-small-v1"
  alias_name: "enterprise-rag-bge-small"
  bulk_size: 256
  request_timeout: 180

llm:
  provider: "openai_compatible"
  api_base: "http://10.72.100.35:7777/v1"
  api_key_env: "LARK_API_KEY"
  model_name: "lark"
  temperature: 0.0
  max_tokens: 4096
  timeout: 180
  retry_attempts: 3
  retry_backoff_seconds: 1.0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

retrieval:
  method: "hybrid"
  top_k: 30
  candidate_k: 240
  fusion_method: "rrf"
  rrf_k: 60
  dense_weight: 0.3
  reranker:
    enabled: false
  parent_expansion:
    enabled: false

generation:
  max_context_chunks: 10
  max_chunks_per_doc: 4
  max_document_ids: 10
  evidence_selection_enabled: true
  evidence_selection_mode: "precision_v3"
  evidence_selection_candidate_chunks: 24
  evidence_selection_max_chunks: 10
  evidence_selection_anchor_chunks: 0
  evidence_selection_fallback_chunks: 0
  evidence_selection_fail_closed: true
  fact_verification_enabled: true
  final_answer_audit_enabled: true

pageindex:
  enabled: true
  home: "/opt/enterprise-rag-bench/PageIndex"
  manifest_path: ".index_cache/full_es_bge_small/manifest.sqlite3"
  cache_dir: ".pageindex_cache/balanced10_v6b"
  min_words: 350
  min_headings: 2
  max_candidate_documents: 24
  max_nodes_per_document: 40
  node_preview_chars: 800
  max_followup_queries: 4
  max_hops: 2
  require_node_audit: true
  fallback_to_es_on_incomplete: true
  max_partial_full_document_chars: 18000
  semantic_event_full_max_chars: 40000

evaluation:
  enabled: false

pipeline:
  name: "pageindex_balanced10_v6b_20260804"
  source_filter: []
  source_filter_mode: "exact"
  question_ids:
    - "qst_0301" # intra_document_reasoning precision baseline
    - "qst_0341" # project_related precision baseline
    - "qst_0154" # basic
    - "qst_0298" # semantic
    - "qst_0386" # constrained
    - "qst_0459" # miscellaneous
    - "qst_0498" # info_not_found
    - "qst_0416" # conflicting_info
    - "qst_0432" # completeness
    - "qst_0480" # high_level
  overwrite_index: false
  resume: true
  resume_legacy: false
  checkpoint_interval: 1
