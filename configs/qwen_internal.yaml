# EnterpriseRAG-Bench Pipeline Configuration - Internal Qwen3.5-27B
# Internal API: 10.72.100.35:7777, model: lark
# max_tokens: 80000, OpenAI-compatible

# ===== Data paths =====
corpus_dir: "demo_corpus"
questions_file: "questions.jsonl"
output_dir: "outputs"
index_dir: ".index_cache/demo_bm25"

# ===== Chunking =====
chunking:
  method: "fixed"
  version: "fixed-v2"
  manifest_enabled: true
  chunk_size: 512
  chunk_overlap: 0

# ===== Embedding =====
embedding:
  provider: "ollama"
  model_name: "nomic-embed-text"
  api_base: "http://localhost:11434"
  device: "cpu"
  batch_size: 16
  dimension: 0

# ===== LLM (Internal Qwen3.5-27B) =====
llm:
  provider: "openai_compatible"
  api_base: "http://10.72.100.35:7777/v1"
  api_key_env: "LARK_API_KEY"
  model_name: "lark"
  temperature: 0.0
  max_tokens: 4096
  timeout: 180
  retry_attempts: 3
  retry_backoff_seconds: 1.0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

# ===== Retrieval =====
retrieval:
  method: "bm25"
  top_k: 10
  dense_weight: 0.5
  fusion_method: "rrf"
  candidate_k: 100
  rrf_k: 60
  reranker:
    enabled: false
    model_name: ""
    top_n: 10

# ===== Evaluation (also uses internal Qwen) =====
evaluation:
  enabled: true
  parallelism: 8
  timeout: 3600
  resume: true
  llm:
    provider: "openai_compatible"
    api_base: "http://10.72.100.35:7777/v1"
    api_key_env: "LARK_API_KEY"
    model_name: "lark"
    temperature: 0.0
  no_correction: true

# ===== Pipeline =====
pipeline:
  name: "baseline_qwen_fixed"
  source_filter: ["github"]
  source_filter_mode: "exact"
  overwrite_index: false
  resume: true
  resume_legacy: false
  checkpoint_interval: 1

generation:
  max_context_chunks: 8
  max_chunks_per_doc: 2
  max_document_ids: 10
