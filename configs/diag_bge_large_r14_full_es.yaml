# R14: isolated full-corpus retrieval index for BGE-large vs BGE-small.
# This index is read-only for evaluation after the one-time build.
corpus_dir: "corpus/all_documents"
questions_file: "questions.jsonl"
output_dir: "outputs"
index_dir: ".index_cache/full_es_bge_large_en_v1_512"
index_backend: "elasticsearch"

chunking:
  method: "fixed"
  version: "fixed-v2"
  manifest_enabled: true
  chunk_size: 512
  chunk_overlap: 0

embedding:
  provider: "sentence_transformers"
  model_name: "/data06/embedding-models/bge-large-en-v1.5"
  device: "cpu"
  batch_size: 128
  dimension: 1024
  revision: ""

elasticsearch:
  url: "http://127.0.0.1:9200"
  index_name: "enterprise-rag-bge-large-en-v1-512"
  alias_name: "enterprise-rag-bge-large-en-v1-512-alias"
  bulk_size: 512
  request_timeout: 180

pipeline:
  name: "diag_bge_large_r14_full_es"
  overwrite_index: false
  max_index_chunks: null
