# Q3 adaptation A2: A1 plus a single dense-weight change (0.3 -> 0.5).
corpus_dir: "corpus/all_documents"
questions_file: "questions.jsonl"
output_dir: "outputs"
index_dir: ".index_cache/full_es_qwen3_emb"
index_backend: "elasticsearch"

chunking:
  method: "fixed"
  version: "hierarchical-v1-448"
  manifest_enabled: true
  chunk_size: 448
  chunk_overlap: 32

embedding:
  provider: "openai_compatible"
  model_name: "embedding"
  api_base: "http://10.72.55.209:7993/v1"
  api_key_env: "EMBEDDING_API_KEY"
  device: "cpu"
  batch_size: 512
  dimension: 1792
  query_prefix: "Instruct: Given an enterprise question, retrieve passages that directly answer it.\nQuery: "

elasticsearch:
  url: "http://10.72.100.29:31920"
  index_name: "enterprise-rag-qwen3-emb-v2"
  alias_name: "enterprise-rag-qwen3-emb"
  bulk_size: 256
  request_timeout: 180
  shards: 16
  dense_mode: "script_score"

llm:
  provider: "openai_compatible"
  api_base: "http://10.72.100.35:7777/v1"
  api_key_env: "LARK_API_KEY"
  model_name: "lark"
  temperature: 0.0
  max_tokens: 4096
  timeout: 180
  retry_attempts: 3
  retry_backoff_seconds: 1.0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

retrieval:
  method: "hybrid"
  top_k: 30
  candidate_k: 240
  fusion_method: "rrf"
  rrf_k: 60
  dense_weight: 0.5
  collapse_recursive_partitions: true
  reranker:
    enabled: false
  parent_expansion:
    enabled: false

generation:
  max_context_chunks: 10
  max_chunks_per_doc: 4
  max_document_ids: 10
  evidence_selection_enabled: true
  evidence_selection_mode: "precision_v3"
  evidence_selection_candidate_chunks: 24
  evidence_selection_max_chunks: 10
  evidence_selection_anchor_chunks: 0
  evidence_selection_fallback_chunks: 0
  evidence_selection_fail_closed: true
  fact_verification_enabled: true
  final_answer_audit_enabled: true

pageindex:
  enabled: true
  home: "/opt/enterprise-rag-bench/PageIndex"
  manifest_path: ".index_cache/full_es_qwen3_emb/manifest.sqlite3"
  cache_dir: ".pageindex_cache/q3adapt_basic18_instruction_d05"
  min_words: 350
  min_headings: 2
  max_candidate_documents: 24
  max_nodes_per_document: 40
  node_preview_chars: 800
  max_followup_queries: 4
  max_hops: 2
  require_node_audit: true
  fallback_to_es_on_incomplete: true
  max_partial_full_document_chars: 18000
  semantic_event_full_max_chars: 40000

evaluation:
  enabled: false

pipeline:
  name: "q3adapt_basic18_instruction_d05_20260812"
  source_filter: []
  source_filter_mode: "exact"
  question_ids:
    - "qst_0013"
    - "qst_0018"
    - "qst_0022"
    - "qst_0030"
    - "qst_0035"
    - "qst_0041"
    - "qst_0050"
    - "qst_0056"
    - "qst_0079"
    - "qst_0082"
    - "qst_0093"
    - "qst_0107"
    - "qst_0112"
    - "qst_0116"
    - "qst_0119"
    - "qst_0125"
    - "qst_0154"
    - "qst_0169"
  overwrite_index: false
  read_existing_index: true
  resume: true
  resume_legacy: false
  checkpoint_interval: 1
