# Qwen3 Embedding v2，固定 50 题分层评测配置。
# 首轮 Q3-A 保持 reranker=false，用于隔离“新 embedding + 新切块 + 新索引”的贡献；
# Q3-B 应复制为独立配置后仅启用 remote reranker，禁止覆盖本文件的基线语义。
# ES 版本为 7.17.8，dense 检索必须使用 script_score。
corpus_dir: "corpus/all_documents"
questions_file: "questions.jsonl"
output_dir: "outputs"
index_dir: ".index_cache/full_es_qwen3_emb"
index_backend: "elasticsearch"

chunking:
  method: "fixed"
  version: "hierarchical-v1-448"
  manifest_enabled: true
  chunk_size: 448
  chunk_overlap: 32

embedding:
  provider: "openai_compatible"
  model_name: "embedding"
  api_base: "http://10.72.55.209:7993/v1"
  api_key_env: "EMBEDDING_API_KEY"
  device: "cpu"
  batch_size: 512
  dimension: 1792

elasticsearch:
  url: "http://10.72.100.29:31920"
  index_name: "enterprise-rag-qwen3-emb-v2"
  alias_name: "enterprise-rag-qwen3-emb"
  bulk_size: 256
  request_timeout: 180
  shards: 16
  # ES 7.17.8 has no native knn query; script_score = cosineSimilarity.
  dense_mode: "script_score"

llm:
  provider: "openai_compatible"
  api_base: "http://10.72.100.35:7777/v1"
  api_key_env: "LARK_API_KEY"
  model_name: "lark"
  temperature: 0.0
  max_tokens: 4096
  timeout: 180
  retry_attempts: 3
  retry_backoff_seconds: 1.0
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

retrieval:
  method: "hybrid"
  top_k: 30
  candidate_k: 240
  fusion_method: "rrf"
  rrf_k: 60
  dense_weight: 0.3
  # Conan's 512-token limit can recursively split one cached chunk into
  # __pN child vectors. Fuse those children as one candidate before rerank.
  collapse_recursive_partitions: true
  reranker:
    enabled: false
  parent_expansion:
    enabled: false

generation:
  max_context_chunks: 10
  max_chunks_per_doc: 4
  max_document_ids: 10
  evidence_selection_enabled: true
  evidence_selection_mode: "precision_v3"
  evidence_selection_candidate_chunks: 24
  evidence_selection_max_chunks: 10
  evidence_selection_anchor_chunks: 0
  evidence_selection_fallback_chunks: 0
  evidence_selection_fail_closed: true
  fact_verification_enabled: true
  final_answer_audit_enabled: true

pageindex:
  enabled: true
  home: "/opt/enterprise-rag-bench/PageIndex"
  manifest_path: ".index_cache/full_es_qwen3_emb/manifest.sqlite3"
  cache_dir: ".pageindex_cache/balanced50_q3emb_20260812"
  min_words: 350
  min_headings: 2
  max_candidate_documents: 24
  max_nodes_per_document: 40
  node_preview_chars: 800
  max_followup_queries: 4
  max_hops: 2
  require_node_audit: true
  fallback_to_es_on_incomplete: true
  max_partial_full_document_chars: 18000
  semantic_event_full_max_chars: 40000

evaluation:
  enabled: false

pipeline:
  name: "pageindex_balanced50_q3emb_20260812"
  source_filter: []
  source_filter_mode: "exact"
  question_ids:
    - "qst_0013"
    - "qst_0018"
    - "qst_0022"
    - "qst_0030"
    - "qst_0035"
    - "qst_0041"
    - "qst_0050"
    - "qst_0056"
    - "qst_0079"
    - "qst_0082"
    - "qst_0093"
    - "qst_0107"
    - "qst_0112"
    - "qst_0116"
    - "qst_0119"
    - "qst_0125"
    - "qst_0154"
    - "qst_0169"
    - "qst_0184"
    - "qst_0197"
    - "qst_0211"
    - "qst_0231"
    - "qst_0236"
    - "qst_0241"
    - "qst_0251"
    - "qst_0271"
    - "qst_0272"
    - "qst_0280"
    - "qst_0291"
    - "qst_0298"
    - "qst_0301"
    - "qst_0322"
    - "qst_0324"
    - "qst_0328"
    - "qst_0341"
    - "qst_0350"
    - "qst_0356"
    - "qst_0362"
    - "qst_0386"
    - "qst_0390"
    - "qst_0406"
    - "qst_0413"
    - "qst_0416"
    - "qst_0432"
    - "qst_0447"
    - "qst_0459"
    - "qst_0470"
    - "qst_0480"
    - "qst_0491"
    - "qst_0498"
  overwrite_index: false
  # This is an evaluation of the prebuilt Qwen3 ES index. Do not reindex
  # cached base chunks, because oversized inputs are represented by __pN
  # vector children rather than necessarily by their unsuffixed parent ID.
  read_existing_index: true
  resume: true
  resume_legacy: false
  checkpoint_interval: 1
